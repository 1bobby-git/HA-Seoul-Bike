name: Prepare Favorites Fix
on:
  push:
    branches: [fix/favorites-reload-20260908]
permissions:
  contents: write
jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply exact-context favorites patch
        run: python scripts/prepare_favorites_fix.py
      - name: Install test dependency
        run: python -m pip install 'aiohttp>=3.11,<4'
      - name: Run complete unit suite
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_*.py' -v 2>&1 | tee test-results.log
          python -m compileall -q custom_components
          python scripts/check_release_alignment.py v1.3.5
          python scripts/build_release.py
          git diff --check
      - name: Commit tested source changes to fix branch only
        env:
          FIX_BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          test "$FIX_BRANCH" = 'fix/favorites-reload-20260908'
          git rm -- scripts/prepare_favorites_fix.py .github/workflows/prepare-favorites-fix.yml
          git add -- custom_components/seoul_bike tests/test_favorites_sync.py README.md CHANGELOG.md docs/releases/v1.3.5.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fix favorites reload reconciliation and prepare v1.3.5'
          git push origin "HEAD:$FIX_BRANCH"
      - name: Archive tested source for review
        if: always()
        run: zip -qr tested-source.zip custom_components tests scripts docs README.md CHANGELOG.md .github
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: favorites-validation
          path: |
            tested-source.zip
            test-results.log
          retention-days: 1

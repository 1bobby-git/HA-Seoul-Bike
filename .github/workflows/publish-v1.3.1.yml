name: Publish Seoul Bike v1.3.1

on:
  push:
    branches:
      - release/v1.3.1

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: f75fb8e9df39e527b6655ed3e452146bfe948f48
        run: |
          if gh release view v1.3.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            exit 0
          fi
          gh release create v1.3.1 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_SHA" \
            --title "Seoul Bike v1.3.1" \
            --notes $'- 자동 쿠키 회전에 따른 불필요한 통합 재로드 제거\n- 인증 실패와 네트워크 실패를 분리하고 재인증 흐름 추가\n- 대여 상태 응답 필드를 단일 스키마로 정규화\n- Home Assistant config-entry 범위 기기 조회 적용'

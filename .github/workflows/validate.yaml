name: Validate
on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to validate against manifest.version
        required: true
        type: string
  schedule:
    - cron: "0 0 * * *"
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install HTTP test dependency
        run: python -m pip install "aiohttp>=3.11,<4"
      - name: Unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Compile integration
        run: python -m compileall -q custom_components
      - name: Verify release package
        run: python scripts/build_release.py

  validate-hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
  validate-hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@master

  validate-release-alignment:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Release alignment
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: python scripts/check_release_alignment.py "$RELEASE_TAG"

  publish-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [unit-tests, validate-hacs, validate-hassfest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: seoul-bike-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify and publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          VERSION=$(python -c 'import json; print(json.load(open("custom_components/seoul_bike/manifest.json"))["version"])')
          TAG="v$VERSION"
          python scripts/check_release_alignment.py "$TAG"
          python scripts/build_release.py
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving it unchanged."
            exit 0
          fi
          CURRENT_SHA=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')
          test "$CURRENT_SHA" = "$RELEASE_SHA"
          test -f "docs/releases/$TAG.md"
          gh release create "$TAG" dist/seoul_bike.zip dist/SHA256SUMS.txt \
            --target "$RELEASE_SHA" --title "Seoul Bike $TAG" \
            --notes-file "docs/releases/$TAG.md" --latest

name: One-time README branding

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/readme-branding-once.yml

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Add integration logo and star badge
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("README.md")
          text = path.read_text(encoding="utf-8-sig")
          marker = "<!-- project-branding:start -->"
          header = '''<!-- project-branding:start -->
          <p align="center">
            <img src="https://raw.githubusercontent.com/1bobby-git/brands/master/custom_integrations/seoul_bike/logo.png" alt="서울자전거 따릉이 로고" width="240">
          </p>
          <p align="center">
            <a href="https://github.com/1bobby-git/HA-Seoul-Bike/stargazers">
              <img src="https://img.shields.io/github/stars/1bobby-git/HA-Seoul-Bike?style=flat-square&logo=github&label=Stars" alt="GitHub Stars">
            </a>
          </p>
          <!-- project-branding:end -->

          '''

          if marker not in text:
              path.write_text(header + text, encoding="utf-8")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if ! git diff --cached --quiet; then
            git commit -m "docs: add integration logo and star badge"
            git push
          fi

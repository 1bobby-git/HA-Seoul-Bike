name: One-time horizontal README logo

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/readme-horizontal-logo-once.yml

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply horizontal logo
        env:
          REPOSITORY_NAME: HA-Seoul-Bike
          LOGO_SOURCE: https://raw.githubusercontent.com/1bobby-git/brands/master/custom_integrations/seoul_bike/logo%402x.png
          LOGO_WIDTH: "420"
          LOGO_ALT: 서울자전거 따릉이 로고
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import html
          import os
          import re
          from pathlib import Path

          repo = os.environ["REPOSITORY_NAME"]
          logo_source = os.environ["LOGO_SOURCE"]
          logo_width = os.environ["LOGO_WIDTH"]
          logo_alt = os.environ["LOGO_ALT"]
          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")
          block = "\n".join([
              "<!-- project-branding:start -->",
              '<p align="center">',
              f'  <img src="{logo_source}" alt="{html.escape(logo_alt, quote=True)}" width="{logo_width}">',
              "</p>",
              '<p align="center">',
              f'  <a href="https://github.com/1bobby-git/{repo}/stargazers">',
              f'    <img src="https://img.shields.io/github/stars/1bobby-git/{repo}?style=flat-square&logo=github&label=Stars" alt="GitHub Stars">',
              "  </a>",
              "</p>",
              "<!-- project-branding:end -->",
              "",
              "",
          ])
          pattern = re.compile(r"<!-- project-branding:start -->.*?<!-- project-branding:end -->\s*", re.S)
          text = pattern.sub(block, text, count=1) if pattern.search(text) else block + text.lstrip("\ufeff")
          readme.write_text(text, encoding="utf-8")
          PY

          rm -f .github/workflows/readme-horizontal-logo-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: use horizontal logo in README"
          git push
